<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google APIs</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #4b5563;
    --accent: #d62828;
    --accent-dark: #a81f1f;
    --focus: #1d4ed8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 14px;
    padding: 32px 24px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.6rem;
    text-align: center;
  }

  .sub {
    margin: 0 0 28px;
    text-align: center;
    color: var(--muted);
    font-size: 1rem;
  }

  .menu {
    display: grid;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 12px 20px;
    border-radius: 10px;
    background: var(--header-color, rgb(12, 121, 175));
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    transition: background-color .15s ease;
  }

  .btn:hover { background: var(--accent-dark); }

  .btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Google APIs</h1>
    <p class="sub">Escolha uma API para testar:</p>

    <nav aria-label="APIs disponíveis">
      <div class="menu">
        <a class="btn" href="/src/templates/promptApi.html">Prompt API</a>
        <a class="btn" href="/src/templates/summarizerApi.html">Summarizer API</a>
        <a class="btn" href="/src/templates/languageDetectorApi.html">Language Detector API</a>
        <a class="btn" href="/src/templates/translatorApi.html">Translator API</a>
      </div>
    </nav>
  </main>

</body>
</html>
