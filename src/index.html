<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Moto</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #d5d9e0;
    --accent: #d62828;
    --accent-dark: #a81f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 14px;
    padding: 28px 24px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
  }
  /* h1 { margin: 0 0 4px; font-size: 1.5rem; } */
  .sub { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
  .field { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .92rem; }
  input, textarea {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  textarea { min-height: 110px; resize: vertical; }
  .unit { position: relative; }
  .unit input { padding-right: 48px; }
  .unit span {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: .9rem; pointer-events: none;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 11px 20px; border-radius: 8px; border: 1px solid transparent;
  }
  h1 {
    display: flex;
    width: fit-content;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Google APIs</h1>
    <p class="sub"></p>

    
    
   
<button onclick="location.href='/src/templates/promptApi.html'" class="primary"> <h2> Prompt Api</h2></button>
<button onclick="location.href='/src/templates/summarizerApi.html'" class="primary"> <h2> Summarizer Api</h2></button>
  
  </main>
 
  <script type="module" src="../dist/index.js"></script>

</body>
</html>
